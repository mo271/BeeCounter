<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeeCounter</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>🐝 BeeCounter</h1>
  <p class="sub">Upload photos of your frames. Each bee gets a dot. Click a dot to change its type, click an empty spot to add a bee.</p>
</header>

<main>
  <section class="left">
    <label id="drop" class="drop">
      <input id="file" type="file" accept="image/*" multiple hidden>
      <span>Drop images here or <u>choose files</u></span>
      <small>Phone users: this opens your camera or gallery.</small>
    </label>

    <div id="images" class="images"></div>

    <div class="totals card">
      <h2>Hive total</h2>
      <div id="totals" class="counts"></div>
      <div class="row">
        <button id="export-json">Export JSON</button>
        <button id="export-csv">Export CSV</button>
        <button id="clear" class="danger">Clear all</button>
      </div>
    </div>
  </section>

  <section class="right">
    <div id="viewer" class="viewer card" hidden>
      <div class="toolbar">
        <strong id="viewer-name"></strong>
        <label><input id="show-dots" type="checkbox" checked> Show dots</label>
        <label>Dot size <input id="dot-size" type="range" min="2" max="14" value="6"></label>
        <span class="legend">
          <i class="dot worker"></i> worker
          <i class="dot drone"></i> drone
          <i class="dot queen"></i> queen
          <i class="dot varroa"></i> varroa
        </span>
      </div>
      <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
      <div id="viewer-counts" class="counts"></div>
      <p class="hint">Click a dot: worker → drone → queen → remove. Click empty space: add a worker.</p>
    </div>
    <div id="empty" class="empty">No image selected yet.</div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
